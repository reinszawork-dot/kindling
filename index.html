<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kindling</title>
  <meta name="description" content="Kindling: a calm, beautiful habit tracker with real analytics, goals and streaks. Private, offline, no account." />
  <meta name="theme-color" content="#F8F5F0" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Kindling" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = (JSON.parse(localStorage.getItem('kindling.v1') || '{}').settings || {}).theme || JSON.parse(localStorage.getItem('kindling.v1') || '{}').theme; if (t) document.documentElement.dataset.theme = t;
      // Pro accent colour (only when a Kindling Pro unlock is stored on this device).
      var a = (JSON.parse(localStorage.getItem('kindling.v1') || '{}').settings || {}).accent; if (a && localStorage.getItem('nextwave:pro:kindling')) document.documentElement.dataset.accent = a; } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="booting" aria-busy="true">
    <div class="boot-side"></div>
    <div class="boot-main">
      <div class="skeleton" style="height:64px;max-width:420px"></div>
      <div class="skeleton" style="height:230px"></div>
      <div class="skeleton" style="height:320px"></div>
    </div>
  </div>
  <noscript><p style="padding:24px;font-family:sans-serif">Kindling needs JavaScript to run.</p></noscript>
  <script src="nextwave-pro.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
